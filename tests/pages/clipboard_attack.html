<!doctype html>
<html><head><meta charset="utf-8"><title>clipboard attack</title></head>
<body style="font-family:system-ui;padding:24px;background:#1a0a0a;color:#fff">
<!--
  ATTAQUE  : tente de lire le clipboard sans gesture, ou en boucle après gesture.
  ATTENDU  : `set_javascript_can_access_clipboard(false)` empêche tout accès.
             Le bouton Lire doit échouer (rejet ou exception silencieuse).
-->
<h1>clipboard read attempt</h1>
<button id="auto">Auto au load</button>
<button id="read">Lire clipboard (gesture)</button>
<button id="loop">Lire en boucle</button>
<pre id="out" style="background:#000;padding:12px;margin-top:12px"></pre>
<script>
const out = document.getElementById('out');
const log = m => { out.textContent += m + '\n'; };
async function tryRead() {
  try { log('got: ' + (await navigator.clipboard.readText())); }
  catch (e) { log('refused: ' + e.message); }
}
// Pas de gesture → doit échouer.
tryRead();
document.getElementById('read').onclick = tryRead;
document.getElementById('loop').onclick = () => setInterval(tryRead, 200);
</script>
</body></html>
