[package]
name    = "nyx"
version = "0.1.0"
edition = "2021"

[dependencies]
nyx-core   = { path = "../nyx-core" }
vault      = { path = "../vault" }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

# GTK3 + WebKitGTK 4.1 — most mature Rust bindings available today
gtk        = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0",  features = ["v2_40"] }
# FFI directe pour UserContentFilterStore (absent des bindings 2.0)
# — unique module unsafe du crate : src/web/content_filter.rs
webkit2gtk-sys = "2.0"
# Lecture des script-messages (capture de mots de passe)
javascriptcore = { package = "javascriptcore-rs", version = "1.1" }
glib       = "0.18"

# Bloqueur production : moteur Brave + EasyList/EasyPrivacy bundlées gzippées
adblock = { version = "0.12", features = ["content-blocking"] }
flate2  = "1.0"

[dev-dependencies]
chrono = { workspace = true }

# Le workspace interdit `unsafe` (forbid) ; le crate browser le passe en
# `deny` pour autoriser l'unique exception auditée de web/content_filter.rs
# (FFI WebKit, #[allow(unsafe_code)] local). nyx-core et vault restent forbid.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
