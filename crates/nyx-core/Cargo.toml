[package]
name = "nyx-core"
version = "0.1.0"
edition = "2021"

[dependencies]
idna      = "0.5"
# RustCrypto SHA-256 — pure Rust, audité. Utilisé pour le post-flight
# hash dans le bridge download (quarantaine metadata).
sha2      = "0.10"
# OS CSPRNG — pour le suffix random du temp path (cf. staging.rs).
# Seul appel impur de nyx-core, isolé dans `fresh_random_bytes`.
getrandom = "0.2"
# Bloqueur production (moteur Brave) — SANS la feature par défaut
# `single-thread`, pour que `Engine` soit `Send + Sync` (partagé entre les
# threads réseau d'Android). Cf. `adfilter.rs`.
adblock   = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
flate2    = "1.0"

[lints]
workspace = true
