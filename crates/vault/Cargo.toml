[package]
name    = "vault"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
# CSPRNG de l'OS — clé d'appareil (32 octets). Déjà utilisé par nyx-core.
getrandom  = "0.2"
# Uuids déterministes de l'historique et des réglages (schéma v3, sync).
# Déjà utilisé par nyx-core (même version, aucun crate en plus).
sha2       = "0.10"

# SQLCipher (AES-256) — deux montages selon la plateforme, même API :
# • Linux/macOS : `sqlcipher`, lié à la libsqlcipher du système
#   (libsqlcipher-dev) ;
# • Windows (MSVC, et GNU pour le contrôle croisé) et Android : SQLCipher
#   compilé depuis les sources + OpenSSL vendu (openssl-src : Perl requis,
#   Strawberry Perl sur windows-latest ; pour Android, cargo-ndk exporte le
#   clang/llvm-ar du NDK). Aucune bibliothèque externe à livrer : ni DLL avec
#   Nyx.exe, ni .so en plus de libnyx_ffi.so dans l'APK.
[target.'cfg(not(any(windows, target_os = "android")))'.dependencies]
rusqlite = { version = "0.31", features = ["sqlcipher"] }

[target.'cfg(any(windows, target_os = "android"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[lints]
workspace = true
