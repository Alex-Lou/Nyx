[workspace]
members = [
    "crates/browser",
    "crates/nyx-core",
    "crates/vault",
]
resolver = "2"

[workspace.dependencies]
anyhow   = "1.0"
serde    = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono   = { version = "0.4", features = ["serde"] }

# Linter — nécessaire sans être pénible. Aucun code unsafe toléré
# (le projet n'en a pas), et les lints clippy standards en warning.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
