[workspace]
members = [
    "crates/browser",
    "crates/vault",
]
resolver = "2"

[workspace.dependencies]
anyhow   = "1.0"
serde    = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono   = { version = "0.4", features = ["serde"] }

# Les dépendances (moteur adblock surtout) sont optimisées même en dev :
# parser EasyList en debug prend >1 min, en opt quelques secondes.
# Nos crates restent en debug (compile rapide, backtraces propres).
[profile.dev.package."*"]
opt-level = 2

# Linter — nécessaire sans être pénible. Code unsafe interdit, à UNE
# exception auditée près : browser/src/web/content_filter.rs (FFI WebKit
# UserContentFilterStore, absente des bindings Rust — c'est le seul moyen
# de bloquer les sous-ressources pub). Le crate browser passe par ses
# propres [lints] (deny + allow ciblé) ; vault reste en forbid via ici.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
