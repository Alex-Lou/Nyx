<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nyx</title>
<style>
:root {
    --deep:    #0a0a18;
    --surface: #0f0f22;
    --border:  #1e1e40;
    --star:    #c8d6ff;
    --aurora:  #4af2c8;
    --text:    #dde4ff;
    --dim:     #7078a8;
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    height: 100%;
    background: var(--deep);
    color: var(--text);
    font-family: 'Geist Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
}
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
}
.wordmark {
    font-size: clamp(72px, 12vw, 132px);
    font-weight: 200;
    letter-spacing: 0.12em;
    color: var(--aurora);
    text-shadow: 0 0 48px rgba(74, 242, 200, 0.32);
    margin: 0;
    line-height: 1;
    user-select: none;
}
.search {
    display: flex;
    align-items: center;
    width: min(580px, 86%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    transition: border-color 180ms cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow    180ms cubic-bezier(0.4, 0, 0.2, 1);
}
.search:focus-within {
    border-color: var(--aurora);
    box-shadow: 0 0 0 1px var(--aurora),
                0 0 24px rgba(74, 242, 200, 0.15);
}
.search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    font-size: 15px;
}
.search input::placeholder { color: var(--dim); }
.hint {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-align: center;
    user-select: none;
}
.hint kbd {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--star);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    margin: 0 1px;
    padding: 2px 6px;
}
</style>
</head>
<body>
    <h1 class="wordmark">Nyx</h1>
    <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
        <input name="q" placeholder="Rechercher avec DuckDuckGo…" autofocus>
    </form>
    <p class="hint">
        <kbd>Ctrl</kbd><kbd>T</kbd> nouvel onglet
        &nbsp;·&nbsp;
        <kbd>Ctrl</kbd><kbd>L</kbd> barre d&rsquo;adresse
        &nbsp;·&nbsp;
        <kbd>Ctrl</kbd><kbd>W</kbd> fermer
    </p>
</body>
</html>
