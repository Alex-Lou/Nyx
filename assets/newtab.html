<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; form-action https://duckduckgo.com">
<title>Nyx</title>
<style>
:root {
    --bg:      #050510;
    --text:    #e8ecff;
    --muted:   #7078a8;
    --aurora:  #4af2c8;
    --glass:   rgba(10, 10, 26, 0.45);
    --glass-b: rgba(120, 130, 200, 0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }

body {
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 38px;
}

/* ── Couches de fond ─────────────────────────────────────── */

/* Lueurs nébuleuses */
.glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
        radial-gradient(ellipse 70% 55% at 22% 18%, rgba(157,110,247,.12), transparent 60%),
        radial-gradient(ellipse 60% 50% at 82% 76%, rgba(74,242,200,.07),  transparent 55%),
        radial-gradient(ellipse 90% 60% at 50% 110%, rgba(123,140,222,.09), transparent 60%);
    transition: background 1.2s ease;
}

/* Orbes flottants */
.orb { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; filter: blur(100px); }
.orb-1 { width: 520px; height: 520px; background: rgba(157,110,247,.10); top: -12%; left: -8%;
         animation: float 18s ease-in-out infinite alternate; }
.orb-2 { width: 380px; height: 380px; background: rgba(74,242,200,.06);  bottom: -8%; right: -6%;
         animation: float 22s ease-in-out infinite alternate -8s; }
@keyframes float {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(28px,-22px) scale(1.05); }
    100% { transform: translate(-16px,14px) scale(0.97); }
}

/* Canvas particules */
#fx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* Grille fine */
.grid {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .5;
    background-image:
        linear-gradient(rgba(108,99,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,.022) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 30%, transparent 80%);
}

/* Vignette */
.vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse 75% 65% at 50% 48%,
        transparent 50%, rgba(5,5,16,.45) 100%);
}

/* ── Contenu ─────────────────────────────────────────────── */

main {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    animation: rise .8s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }

.wordmark {
    font-size: clamp(70px, 12vw, 132px);
    font-weight: 200;
    letter-spacing: .2em;
    line-height: 1;
    user-select: none;
    background: linear-gradient(135deg, #ffffff 0%, #c8d6ff 45%, #9d6ef7 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 40px rgba(157,110,247,.25));
    transition: letter-spacing .6s cubic-bezier(.22,1,.36,1), filter .6s ease;
    animation: breathe 7s ease-in-out infinite;
}
.wordmark:hover { letter-spacing: .28em; filter: drop-shadow(0 2px 55px rgba(74,242,200,.35)); }
@keyframes breathe {
    0%,100% { filter: drop-shadow(0 2px 40px rgba(157,110,247,.22)); }
    50%     { filter: drop-shadow(0 2px 60px rgba(157,110,247,.40)); }
}

.tagline {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); opacity: .7; user-select: none; font-weight: 400;
}

/* Barre de recherche — glass card */
.search {
    display: flex; align-items: center;
    width: min(560px, 86vw);
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid var(--glass-b);
    border-radius: 18px;
    padding: 15px 20px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 40px rgba(0,0,0,.45);
    transition: border-color .3s cubic-bezier(.22,1,.36,1),
                box-shadow   .3s cubic-bezier(.22,1,.36,1),
                transform    .3s cubic-bezier(.22,1,.36,1);
}
.search:focus-within {
    border-color: rgba(74,242,200,.40);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        0 0 0 1px rgba(74,242,200,.16),
        0 16px 48px rgba(0,0,0,.55),
        0 0 40px rgba(74,242,200,.08);
    transform: translateY(-3px);
}
.search svg { width: 17px; height: 17px; margin-right: 12px; flex-shrink: 0; opacity: .5; }
.search input {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    font-size: 14.5px; letter-spacing: .01em; caret-color: var(--aurora);
}
.search input::placeholder { color: rgba(112,120,168,.55); }

/* Sélecteur d'ambiance */
.ambiance {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 18px; align-items: center;
    padding: 9px 18px;
    background: rgba(10,10,26,.4);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-b); border-radius: 28px;
}
.ambiance button {
    background: none; border: 0; cursor: pointer; padding: 4px 2px;
    font-family: inherit; font-size: 11px; letter-spacing: .06em;
    color: var(--muted); opacity: .6;
    display: flex; align-items: center; gap: 7px;
    transition: color .25s ease, opacity .25s ease;
}
.ambiance button::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px currentColor;
    transition: transform .25s cubic-bezier(.22,1,.36,1);
}
.ambiance button:hover { opacity: .9; }
.ambiance button.active { opacity: 1; color: var(--aurora); }
.ambiance button.active::before { transform: scale(1.4); }

.hint {
    position: fixed; top: 26px; right: 28px; z-index: 20;
    color: rgba(112,120,168,.5); font-size: 11px; letter-spacing: .04em; user-select: none;
}
.hint kbd {
    background: rgba(255,255,255,.04); border: 1px solid rgba(120,130,200,.16);
    border-radius: 5px; color: rgba(200,214,255,.7);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 1px 6px; margin: 0 1px;
}

@media (prefers-reduced-motion: reduce) {
    .orb, .wordmark { animation: none; }
}
</style>
</head>
<body>

<div class="glow" id="glow" aria-hidden="true"></div>
<div class="orb orb-1" aria-hidden="true"></div>
<div class="orb orb-2" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grid" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<p class="hint"><kbd>Ctrl</kbd><kbd>T</kbd> onglet · <kbd>Ctrl</kbd><kbd>L</kbd> adresse</p>

<main>
    <div class="brand">
        <h1 class="wordmark">Nyx</h1>
        <p class="tagline">une lumière plus douce</p>
    </div>
    <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input name="q" placeholder="Rechercher…" autofocus spellcheck="false">
    </form>
</main>

<nav class="ambiance" aria-label="Ambiance">
    <button data-mode="nebula" class="active">Nébuleuse</button>
    <button data-mode="aurora">Aurore</button>
    <button data-mode="sky">Ciel</button>
</nav>

<script>
(function () {
    'use strict';
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d', { alpha: true });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const PALETTES = {
        nebula: { dots: ['#c8d6ff', '#9d6ef7', '#ff7eb3'], line: '157,110,247',
                  glow: 'radial-gradient(ellipse 70% 55% at 22% 18%, rgba(157,110,247,.12), transparent 60%),radial-gradient(ellipse 60% 50% at 82% 76%, rgba(255,126,179,.05), transparent 55%),radial-gradient(ellipse 90% 60% at 50% 110%, rgba(123,140,222,.09), transparent 60%)' },
        aurora: { dots: ['#c8d6ff', '#4af2c8', '#7b8cde'], line: '74,242,200',
                  glow: 'radial-gradient(ellipse 70% 55% at 22% 18%, rgba(74,242,200,.10), transparent 60%),radial-gradient(ellipse 60% 50% at 82% 76%, rgba(123,140,222,.07), transparent 55%),radial-gradient(ellipse 90% 60% at 50% 110%, rgba(74,242,200,.07), transparent 60%)' },
        sky:    { dots: ['#ffffff', '#c8d6ff', '#7b8cde'], line: '123,140,222',
                  glow: 'radial-gradient(ellipse 70% 55% at 22% 18%, rgba(123,140,222,.12), transparent 60%),radial-gradient(ellipse 60% 50% at 82% 76%, rgba(200,214,255,.06), transparent 55%),radial-gradient(ellipse 90% 60% at 50% 110%, rgba(123,140,222,.10), transparent 60%)' },
    };

    let palette = PALETTES.nebula;
    let sprites = {};
    let DPR, W, H, particles = [], t = 0;
    let mx = 0.5, my = 0.5;

    function hexToRgb(h) {
        const n = parseInt(h.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    // Sprite glow pré-rendu (bien plus rapide que shadowBlur par particule)
    function buildSprites() {
        sprites = {};
        for (const hex of palette.dots) {
            const s = document.createElement('canvas');
            const size = 64; s.width = s.height = size;
            const g = s.getContext('2d');
            const [r, gr, b] = hexToRgb(hex);
            const grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            grd.addColorStop(0,   `rgba(${r},${gr},${b},1)`);
            grd.addColorStop(0.25,`rgba(${r},${gr},${b},.55)`);
            grd.addColorStop(1,   `rgba(${r},${gr},${b},0)`);
            g.fillStyle = grd; g.fillRect(0, 0, size, size);
            sprites[hex] = s;
        }
    }

    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width  = Math.floor(innerWidth  * DPR);
        H = canvas.height = Math.floor(innerHeight * DPR);
        canvas.style.width  = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
    }

    function seed() {
        const count = Math.min(120, Math.floor(innerWidth * innerHeight / 13000));
        particles = [];
        for (let i = 0; i < count; i++) {
            const hex = palette.dots[Math.floor(Math.random() * palette.dots.length)];
            particles.push({
                x: Math.random() * W, y: Math.random() * H,
                z: 0.4 + Math.random() * 0.6,                 // profondeur
                r: 0.8 + Math.random() * 1.8,                 // rayon de base
                tw: Math.random() * Math.PI * 2,              // phase scintillement
                tws: 0.5 + Math.random() * 1.4,               // vitesse scintillement
                drift: (Math.random() - 0.5) * 0.3,
                hex,
            });
        }
    }

    addEventListener('resize', () => { resize(); seed(); });
    addEventListener('pointermove', e => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; });

    const CONN = 122;  // distance max de connexion (px logiques)

    function frame() {
        t += 0.005;
        ctx.clearRect(0, 0, W, H);

        // Déplacement — champ de vagues sinusoïdal
        for (const p of particles) {
            const wave = Math.sin(p.y * 0.004 + t * 1.5) * 0.28;
            p.x += (0.10 * p.z + wave) * DPR;
            p.y += (Math.cos(p.x * 0.003 + t) * 0.06 + p.drift * p.z) * DPR;
            p.x += (mx - 0.5) * p.z * 0.5 * DPR;             // parallaxe souris
            p.y += (my - 0.5) * p.z * 0.5 * DPR;
            if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
            if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
        }

        // Connexions neuronales (subtiles)
        const max = (CONN * DPR) ** 2;
        ctx.lineWidth = DPR * 0.6;
        for (let i = 0; i < particles.length; i++) {
            const a = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
                const b = particles[j];
                const dx = a.x - b.x, dy = a.y - b.y;
                const d2 = dx * dx + dy * dy;
                if (d2 < max) {
                    const al = (1 - d2 / max) * 0.16;
                    ctx.strokeStyle = `rgba(${palette.line},${al})`;
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
            }
        }

        // Particules — glow additif
        ctx.globalCompositeOperation = 'lighter';
        for (const p of particles) {
            const tw = 0.55 + 0.45 * Math.sin(p.tw + t * p.tws * 4);
            const r = p.r * p.z * DPR * (3.2 + tw * 1.4);
            const sp = sprites[p.hex];
            ctx.globalAlpha = 0.35 + 0.5 * tw;
            ctx.drawImage(sp, p.x - r, p.y - r, r * 2, r * 2);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        requestAnimationFrame(frame);
    }

    function setMode(mode) {
        palette = PALETTES[mode] || PALETTES.nebula;
        buildSprites();
        seed();
        document.getElementById('glow').style.background = palette.glow;
        document.querySelectorAll('.ambiance button').forEach(b =>
            b.classList.toggle('active', b.dataset.mode === mode));
    }

    document.querySelectorAll('.ambiance button').forEach(b =>
        b.addEventListener('click', () => setMode(b.dataset.mode)));

    resize(); buildSprites(); seed();
    if (reduce) {
        // Rendu statique unique (accessibilité)
        ctx.globalCompositeOperation = 'lighter';
        for (const p of particles) {
            const r = p.r * p.z * DPR * 4;
            ctx.globalAlpha = 0.6;
            ctx.drawImage(sprites[p.hex], p.x - r, p.y - r, r * 2, r * 2);
        }
    } else {
        requestAnimationFrame(frame);
    }
})();
</script>
</body>
</html>
