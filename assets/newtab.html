<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; form-action https://duckduckgo.com">
<title>Nyx</title>
{{TOKENS}}
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #05070b; overflow: hidden; }
body {
    color: var(--nyx-text, #dde4ff);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 38px;
}

/* Le shader plein écran = le fond animé */
#fx { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }

/* Voile de profondeur + lisibilité du centre */
.vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 48%, transparent 45%, rgba(5,7,11,.55) 100%);
}

main {
    position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 34px;
    animation: rise .8s cubic-bezier(.22,1,.36,1) both; pointer-events: none;
}
main * { pointer-events: auto; }
@keyframes rise { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wordmark {
    font-size: clamp(70px, 12vw, 132px); font-weight: 200; letter-spacing: .2em; line-height: 1; user-select: none;
    background: linear-gradient(135deg,#fff 0%,var(--nyx-star,#c8d6ff) 45%,var(--nyx-nebula,#9d6ef7) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    /* --nyx-shine 0..1 piloté par JS (proximité curseur). Halo qui s'épaissit + glow froid additionnel. */
    filter:
      drop-shadow(0 2px calc(44px + var(--nyx-shine, 0) * 30px) rgba(157,110,247, calc(.22 + var(--nyx-shine, 0) * .42)))
      drop-shadow(0 0  calc(var(--nyx-shine, 0) * 90px) rgba(220,200,255, calc(var(--nyx-shine, 0) * .40)));
    transition: letter-spacing .6s cubic-bezier(.22,1,.36,1);
}
.wordmark:hover { letter-spacing: .28em; }
.tagline { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--nyx-dim,#7078a8); opacity: .65; user-select: none; }

.search {
    display: flex; align-items: center; width: min(560px, 86vw);
    background: rgba(8,10,18,.5); backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid rgba(120,130,200,.12); border-radius: 18px; padding: 15px 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 40px rgba(0,0,0,.45);
    transition: border-color .3s, box-shadow .3s, transform .3s;
}
.search:focus-within {
    border-color: rgba(74,242,200,.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(74,242,200,.16), 0 16px 48px rgba(0,0,0,.55), 0 0 40px rgba(74,242,200,.08);
    transform: translateY(-3px);
}
.search svg { width: 17px; height: 17px; margin-right: 12px; opacity: .5; flex-shrink: 0; }
.search input {
    flex: 1; background: none; border: 0; outline: 0; color: var(--nyx-text,#dde4ff);
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14.5px; caret-color: var(--nyx-aurora,#4af2c8);
}
.search input::placeholder { color: rgba(112,120,168,.55); }

.ambiance {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; gap: 18px; padding: 9px 18px; background: rgba(8,10,18,.42);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(120,130,200,.12); border-radius: 28px;
}
.ambiance button {
    background: none; border: 0; cursor: pointer; font-family: inherit; font-size: 11px; letter-spacing: .06em;
    color: var(--nyx-dim,#7078a8); opacity: .6; display: flex; align-items: center; gap: 7px; transition: color .25s, opacity .25s;
}
.ambiance button::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; transition:transform .25s; }
.ambiance button:hover { opacity: .9; }
.ambiance button.active { opacity: 1; color: var(--nyx-aurora,#4af2c8); }
.ambiance button.active::before { transform: scale(1.5); }

.hint { position: fixed; top: 24px; right: 26px; z-index: 20; color: rgba(112,120,168,.5); font-size: 11px; user-select: none; }
.hint kbd { background: rgba(255,255,255,.04); border: 1px solid rgba(120,130,200,.16); border-radius: 5px; color: rgba(200,214,255,.7); font-family: 'JetBrains Mono',monospace; font-size: 10px; padding: 1px 6px; margin: 0 1px; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<p class="hint"><kbd>Ctrl</kbd><kbd>T</kbd> onglet · <kbd>Ctrl</kbd><kbd>L</kbd> adresse</p>

<main>
    <div class="brand">
        <h1 class="wordmark">Nyx</h1>
        <p class="tagline">une lumière plus douce</p>
    </div>
    <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input name="q" placeholder="Rechercher…" autofocus spellcheck="false">
    </form>
</main>

<nav class="ambiance" aria-label="Ambiance">
    <button data-mode="nebula" class="active">Nébuleuse</button>
    <button data-mode="aurora">Aurore</button>
    <button data-mode="sky">Ciel</button>
</nav>

<script>
(function () {
    'use strict';
    const canvas = document.getElementById('fx');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ── Constantes d'interaction — réglage du sillage Kelvin + ripples.
    // Pousse ces valeurs pour ajuster la sensation sans toucher au shader.
    const TUNING = {
        // ── Doigt qui PRESSE le liquide : dépression + bourrelet ──
        // Le curseur n'est plus un halo de surface, c'est un point qui
        // creuse vraiment le fluide. Compression au centre (le pattern
        // est aspiré vers le curseur), bourrelet de fluide expulsé en
        // couronne autour, ombre + éclat le long du rebord.
        pressDepth:          0.090, // profondeur de l'aspiration au centre (0..0.2)
        pressRadius:         0.062, // rayon du noyau de la dépression (UV)
        pressRimRadius:      0.135, // rayon externe du bourrelet (UV)
        pressRimHeight:      0.052, // hauteur du bourrelet expulsé
        pressShadeDark:      0.34,  // assombrissement au creux (0..1)
        pressShadeRim:       0.18,  // éclat sur la crête du bourrelet (caustique)

        // ── Sillage en V (Kelvin) — traîne directionnelle derrière ──
        wakeStrength:        1.1,   // atténué : la dépression centrale fait le gros du travail
        wakeLength:          0.50,
        wakeWidth:           0.085,
        wakeAngleTan:        0.38,
        wakeUndulation:      0.008,

        // ── Click : caillou tombe dans l'eau ──
        clickRippleStrength: 0.028,
        clickRippleSpeed:    0.32,
        clickRippleDecay:    5.0,
    };
    // Helper : format un float en littéral GLSL valide (toFixed garantit le `.`).
    const F = n => n.toFixed(4);

    // ── 3 ambiances : flux + accent token. La palette est DÉRIVÉE des tokens CSS Nyx
    //    (--nyx-bg, --nyx-nebula, --nyx-aurora, --nyx-star) → cohérence avec le reste de l'UI.
    const AMB = {
        nebula: { speed: .075, warp: 4.2, vbias: .0, accent: '--nyx-nebula', fb: '#9d6ef7', pal: null, glow: null },
        aurora: { speed: .060, warp: 3.0, vbias: .7, accent: '--nyx-aurora', fb: '#4af2c8', pal: null, glow: null },
        sky:    { speed: .035, warp: 2.3, vbias: .0, accent: '--nyx-star',   fb: '#c8d6ff', pal: null, glow: null },
    };
    let mode = 'nebula', A = AMB.nebula;

    // Parse une couleur CSS → [r,g,b] floats via le moteur du navigateur (gère hex, rgb, hsl, named…).
    const _cpCtx = document.createElement('canvas').getContext('2d');
    function parseColor(str) {
        _cpCtx.fillStyle = '#000'; _cpCtx.fillStyle = str;
        const m = /^#([0-9a-f]{6})$/i.exec(_cpCtx.fillStyle);
        if (!m) return [0, 0, 0];
        const n = parseInt(m[1], 16);
        return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
    }
    function mixCol(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

    function rebuildPalettes() {
        const cs = getComputedStyle(document.documentElement);
        const bg = parseColor(cs.getPropertyValue('--nyx-bg').trim() || '#05070b');
        for (const k of Object.keys(AMB)) {
            const a = AMB[k];
            const accent = parseColor(cs.getPropertyValue(a.accent).trim() || a.fb);
            // p0 = fond profond, p1/p2 = transitions, p3 = accent saturé.
            a.pal = [bg, mixCol(bg, accent, 0.18), mixCol(bg, accent, 0.55), mixCol(bg, accent, 0.92)];
            a.glow = accent;
        }
        A = AMB[mode] || AMB.nebula;
    }
    rebuildPalettes();

    function setMode(name) {
        A = AMB[name] || AMB.nebula; mode = name;
        document.querySelectorAll('.ambiance button').forEach(b => b.classList.toggle('active', b.dataset.mode === name));
    }
    document.querySelectorAll('.ambiance button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

    // Mouse : position brute + lerpée. Vélocité lerpée pour moduler la force du "doigt".
    let rawMx = .5, rawMy = .5, mx = .5, my = .5;
    let prevRawMx = .5, prevRawMy = .5, mvel = 0, mvdx = 0, mvdy = 0;
    // Sillage : 4 échantillons récents (anneau circulaire) — perturbent le fluide derrière.
    const TRAIL = [{x:.5,y:.5,age:9},{x:.5,y:.5,age:9},{x:.5,y:.5,age:9},{x:.5,y:.5,age:9}];
    let trailHead = 0, trailAccum = 0, lastTrailX = .5, lastTrailY = .5;
    // Click ripples : POOL de 16 — chacun vit son cycle complet (~4s), ils coexistent.
    // Pas de reset : un nouveau clic prend le slot le plus VIEUX, jamais un vivant.
    const RIPPLES = Array.from({length:16}, () => ({x:.5,y:.5,age:99}));
    const _rBuf = new Float32Array(48);
    // Wordmark shine : 0..1, lerpé sur la distance souris ↔ centre du mot.
    let shine = 0, wordCx = 0, wordCy = 0, wordReach = 360;
    function measureWord() {
        const el = document.querySelector('.wordmark');
        if (!el) return;
        const r = el.getBoundingClientRect();
        wordCx = r.left + r.width * 0.5;
        wordCy = r.top  + r.height * 0.5;
        // Rayon d'influence : ~85% de la largeur du mot, jamais < 220px.
        wordReach = Math.max(r.width * 0.85, 220);
    }
    addEventListener('resize', measureWord);
    addEventListener('load', measureWord);
    queueMicrotask(measureWord);

    addEventListener('pointermove', e => { rawMx = e.clientX / innerWidth; rawMy = 1 - e.clientY / innerHeight; });
    canvas.addEventListener('pointerdown', e => {
        // Choisir le slot avec l'âge le plus élevé (le plus mort) — jamais d'interruption d'un ripple vivant.
        let pick = 0, maxAge = -1;
        for (let i = 0; i < 16; i++) {
            if (RIPPLES[i].age > maxAge) { maxAge = RIPPLES[i].age; pick = i; }
        }
        const r = RIPPLES[pick];
        r.x = e.clientX / innerWidth;
        r.y = 1 - e.clientY / innerHeight;
        r.age = 0;
    });

    // ── Tente WebGL ; sinon fallback Canvas-2D ─────────────────────────────
    const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false })
            || canvas.getContext('experimental-webgl', { alpha: false });

    let GLU = null;
    if (gl && initGL()) {
        console.info('[Nyx] WebGL fluide actif');
        runGL();
    } else {
        console.warn('[Nyx] WebGL indisponible → fallback Canvas-2D (animation appauvrie). '
            + 'Cause = WebGL context creation OR shader compile/link. Voir errors plus haut.');
        runCanvas2D();
    }

    // ══════════════════════════ WebGL (fluide premium) ════════════════════
    function initGL() {
        try {
            const vs = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
            const fs = `precision highp float;
uniform vec2 u_res;uniform float u_time;uniform vec2 u_mouse;uniform float u_mvel;uniform vec2 u_mdir;
uniform vec3 u_trail0,u_trail1,u_trail2,u_trail3;
uniform vec3 u_ripples[16];
uniform vec3 u_p0,u_p1,u_p2,u_p3,u_glow;uniform float u_warp,u_vbias,u_speed;
// Constantes interaction (injectées depuis TUNING côté JS).
// — Dépression curseur (doigt qui pénètre le fluide) —
const float PRESS_DEPTH         = ${F(TUNING.pressDepth)};
const float PRESS_RADIUS        = ${F(TUNING.pressRadius)};
const float PRESS_RIM_RADIUS    = ${F(TUNING.pressRimRadius)};
const float PRESS_RIM_HEIGHT    = ${F(TUNING.pressRimHeight)};
const float PRESS_SHADE_DARK    = ${F(TUNING.pressShadeDark)};
const float PRESS_SHADE_RIM     = ${F(TUNING.pressShadeRim)};
// — Sillage V derrière —
const float WAKE_STRENGTH       = ${F(TUNING.wakeStrength)};
const float WAKE_LENGTH         = ${F(TUNING.wakeLength)};
const float WAKE_WIDTH          = ${F(TUNING.wakeWidth)};
const float WAKE_UNDULATION     = ${F(TUNING.wakeUndulation)};
// — Clic : caillou —
const float CLICK_RIPPLE_STRENGTH = ${F(TUNING.clickRippleStrength)};
const float CLICK_RIPPLE_SPEED  = ${F(TUNING.clickRippleSpeed)};
const float CLICK_RIPPLE_DECAY  = ${F(TUNING.clickRippleDecay)};
// tan(angle du V). 0.3535 = 19.47° (Kelvin théorique), 0.45 ≈ 24°
// (plus visible / cinematic). Modifiable via TUNING.wakeAngleTan.
const float KELVIN_TAN = ${F(TUNING.wakeAngleTan)};
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.0+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/u_res;
 float aspect=u_res.x/u_res.y;
 vec2 p=uv*vec2(aspect,1.0)*2.4;
 float t=u_time*u_speed;

 // ─── INTERACTION LOCALE — doigt qui PRESSE le liquide ───
 vec2 uvA=uv*vec2(aspect,1.0);
 vec2 mA=u_mouse*vec2(aspect,1.0);
 vec2 dM=uvA-mA;
 float lM2=dot(dM,dM);
 float dist=sqrt(lM2+0.00001);
 // Direction radiale curseur → pixel. Sert à la fois au warp
 // (compression vers / dehors de) et à l'ombrage de la dépression.
 vec2 outDir=dM/dist;
 // Atténuation gaussienne (rayon référence ~0.235 UV) — réutilisée
 // par le torche/halo qui restent collés au curseur.
 float kM=max(0.0,1.0-lM2/0.055);
 float kM2=kM*kM;

 // ── Puits de pression : compression centrale + bourrelet expulsé ──
 // depression : profil cloche 1→0 sur [0, PRESS_RADIUS]. Pattern du
 // fluide aspiré vers le curseur (le doigt ENFONCE).
 float depression=1.0-smoothstep(0.0,PRESS_RADIUS,dist);
 // rim : couronne de fluide expulsée entre PRESS_RADIUS et
 // PRESS_RIM_RADIUS. Profil cloche centrée à mi-chemin (bell symétrique).
 float rimPos=clamp((dist-PRESS_RADIUS)/(PRESS_RIM_RADIUS-PRESS_RADIUS),0.0,1.0);
 // 4*x*(1-x) = parabole avec max 1 à x=0.5, 0 aux bouts. Smoothée
 // par smoothstep aux deux extrémités → C1-continu.
 float rim=4.0*rimPos*(1.0-rimPos);
 rim*=smoothstep(0.0,0.35,rimPos)*smoothstep(1.0,0.65,rimPos);

 // Warp = aspiration centrale (− outDir) + expulsion en rim (+ outDir).
 // C'est le pattern de fbm qui se déforme physiquement, pas un halo.
 vec2 wellPush=outDir*(-depression*PRESS_DEPTH + rim*PRESS_RIM_HEIGHT);

 // Décomposition (D, Nperp) = repère local orienté vélocité souris.
 vec2 D=u_mdir;
 vec2 Nperp=vec2(-D.y,D.x);
 float para=dot(dM,D);
 float lateral=dot(dM,Nperp);
 float backward=max(0.0,-para);

 // ── V-wake Kelvin : 2 branches ondulantes derrière le curseur — SEUL
 // effet directionnel. Pas de bow push (créait une bosse devant), pas de
 // trail historique (créait une barre "T" derrière). Le V respire seul.
 //
 // Ondulation longitudinale : sinusoïde discrète le long du sillage →
 // branches vivantes, pas droites, mais sans "wave" trop visible.
 float undulation=sin(backward*22.0-u_time*4.0)*WAKE_UNDULATION;
 // Distance signée à la branche idéale (= 0 sur la ligne théorique).
 float branchDist=abs(lateral+undulation*sign(lateral))-KELVIN_TAN*backward;
 // Falloff transversal — gaussien cheap : 1/(1+x²).
 float wakeTrans=(WAKE_WIDTH*WAKE_WIDTH)/(WAKE_WIDTH*WAKE_WIDTH+branchDist*branchDist);
 // Décroissance longitudinale — smoothstep QUINTIQUE (encore plus doux
 // que cubique) : démarre fort à la pointe, s'estompe progressivement
 // sans aucune coupure dure. Plus de 'trait profond qui découpe'.
 // NOTE : variable 'wl' et PAS 'r' (collision avec vec2 r plus bas dans
 // la même portée → shader fail silently → fallback Canvas-2D).
 // ATTENTION : pas de backticks dans ce commentaire — ils fermeraient
 // la template literal JS qui contient ce shader (cf. bug 286).
 float wl=max(0.0,1.0-backward/WAKE_LENGTH);
 // smoothstep quintic : wl³(6wl²-15wl+10) — C2-continu, dérivée nulle
 // aux deux bouts → fondu velouté sans cassure perceptible.
 float wakeLong=wl*wl*wl*(wl*(wl*6.0-15.0)+10.0);
 // Anti-front : transition douce (0.012 vs 0.006) pour amorcer le V
 // graduellement plutôt que d'apparaître pile au curseur.
 float wakeFront=smoothstep(0.0,0.012,backward);
 float wakeMag=wakeTrans*wakeLong*wakeFront*u_mvel*WAKE_STRENGTH;

 // Push : perpendiculaire à D (vers l'extérieur des branches) + léger
 // biais arrière → fend le liquide latéralement, en douceur.
 vec2 rawWakeDir=Nperp*sign(lateral)-D*0.30;
 float rwLen=length(rawWakeDir);
 vec2 wakeDir=rawWakeDir/max(rwLen,0.001);
 vec2 wakePush=wakeDir*wakeMag*0.038;

 // ─── Click ripples : caillou tombe — dépression + 3 anneaux amortis ───
 vec2 rippleDisp=vec2(0.0);
 float wave=0.0;
 for(int i=0;i<16;i++){
   vec3 R=u_ripples[i];
   if(R.z>=CLICK_RIPPLE_DECAY) continue;
   vec2 rP=R.xy*vec2(aspect,1.0);
   vec2 rD=uvA-rP;
   float rDist2=dot(rD,rD);
   float rDist=sqrt(rDist2+0.00001);
   vec2 rN=rD/rDist;

   float age=R.z;
   float lifeT=age/CLICK_RIPPLE_DECAY;
   float decay=1.0-lifeT;
   decay*=decay; // amortissement quadratique

   // 1. Dépression initiale au point d'impact (~0.3s).
   float dropPhase=max(0.0,1.0-age*3.3);
   float drop=dropPhase*dropPhase/(1.0+rDist2*180.0);
   rippleDisp-=rN*drop*0.012;

   // 2. Quatre anneaux concentriques espacés dans le temps — capillary waves.
   for(int k=0;k<4;k++){
     float kk=float(k);
     float radius=(age-kk*0.20)*CLICK_RIPPLE_SPEED;
     if(radius<0.0) continue;
     float dr=rDist-radius;
     // Anneaux plus larges pour rendu soft, plus de gradient.
     float ringW=0.028+kk*0.012;
     float intensity=(ringW*ringW)/(ringW*ringW+dr*dr);
     intensity*=decay/(1.0+kk*0.55);
     wave+=intensity*0.65;
     rippleDisp+=rN*intensity*CLICK_RIPPLE_STRENGTH;
   }
 }

 // Warp LOCAL — pas de pan global, le fond reste en place.
 // Composition : PUITS curseur (aspiration + bourrelet) + V derrière +
 // ripples des clics. wellPush remplace l'ancien fingerPush — au lieu
 // d'écarter radialement, on COMPRESSE vers le centre et on EXPULSE
 // en couronne : le pattern fbm est physiquement déformé.
 p+=wellPush+wakePush+rippleDisp*1.5;

 vec2 q=vec2(fbm(p+vec2(0.,t)),fbm(p+vec2(5.2,1.3)-vec2(0.,t*(1.0+u_vbias))));
 vec2 r=vec2(fbm(p+u_warp*q+vec2(1.7,9.2)+t*0.5),fbm(p+u_warp*q+vec2(8.3,2.8)-t*0.5));
 float f=fbm(p+u_warp*r);

 vec3 col=mix(u_p0,u_p1,smoothstep(0.0,0.6,f));
 col=mix(col,u_p2,smoothstep(0.35,0.9,r.x));
 col=mix(col,u_p3,smoothstep(0.55,1.0,q.y)*0.5);
 col+=u_glow*pow(max(f,0.0),3.0)*0.07;

 // Torche : très subtile maintenant — le doigt enfonce, il n'éclaire
 // pas (la dépression centrale est dans l'ombre). On garde juste un
 // soupçon de chaleur au fond du puits pour la couleur ambiante.
 vec3 warm=mix(u_glow,vec3(1.0,0.78,0.55),0.5);
 float torchK=max(0.0,1.0-lM2/0.020);
 col+=warm*(torchK*torchK*torchK)*0.040;
 float haloK=max(0.0,1.0-lM2/0.090);
 col+=u_glow*(haloK*haloK)*0.015;

 // Trace lumineuse SUBTILE le long des branches du V.
 float wakeLight=wakeTrans*wakeLong*wakeFront*u_mvel*0.40;
 col+=warm*wakeLight*0.022;

 // Ondulations radiales lumineuses des ripples (en plus du displacement).
 col+=u_glow*wave*0.12;

 // ─── PÉNÉTRATION PHYSIQUE : ombrage de la dépression ───
 // C'est ce qui transforme la déformation du pattern fbm en relief
 // perceptible. La dépression assombrit (le fond du puits est dans
 // l'ombre du liquide qui le surplombe), le bourrelet capte la lumière
 // comme une caustique d'eau (réfraction concentrée sur la crête).
 // Appliqué APRÈS toutes les sources de lumière surface (torche, halo,
 // V, ripples) → le creux assombrit TOUT, comme un vrai trou.
 float wellShade=-depression*PRESS_SHADE_DARK + rim*PRESS_SHADE_RIM;
 col*=1.0+wellShade;
 // Petit boost chaud sur la crête (caustique froide → légère pointe
 // chaude au moment où la lumière se concentre).
 col+=warm*rim*PRESS_SHADE_RIM*0.35;

 // Vignette + grain.
 float d=distance(uv,vec2(0.5));
 col*=mix(0.80,1.12,smoothstep(0.0,0.85,d));
 col*=1.0-0.32*d*d;
 col+=hash(uv*u_res+u_time)*0.02-0.01;
 gl_FragColor=vec4(col,1.0);
}`;
            const prog = link(vs, fs);
            if (!prog) return false;
            gl.useProgram(prog);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, 'a');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            GLU = {
                res: gl.getUniformLocation(prog, 'u_res'), time: gl.getUniformLocation(prog, 'u_time'),
                mouse: gl.getUniformLocation(prog, 'u_mouse'), mvel: gl.getUniformLocation(prog, 'u_mvel'), mdir: gl.getUniformLocation(prog, 'u_mdir'),
                trail0: gl.getUniformLocation(prog, 'u_trail0'),
                trail1: gl.getUniformLocation(prog, 'u_trail1'),
                trail2: gl.getUniformLocation(prog, 'u_trail2'),
                trail3: gl.getUniformLocation(prog, 'u_trail3'),
                ripples: gl.getUniformLocation(prog, 'u_ripples[0]'),
                p0: gl.getUniformLocation(prog, 'u_p0'), p1: gl.getUniformLocation(prog, 'u_p1'),
                p2: gl.getUniformLocation(prog, 'u_p2'), p3: gl.getUniformLocation(prog, 'u_p3'),
                glow: gl.getUniformLocation(prog, 'u_glow'),
                warp: gl.getUniformLocation(prog, 'u_warp'), vbias: gl.getUniformLocation(prog, 'u_vbias'),
                speed: gl.getUniformLocation(prog, 'u_speed'),
            };
            return true;
        } catch (e) { return false; }
    }

    function link(vsrc, fsrc) {
        // Log explicite des erreurs compile/link → utile F12 quand WebGL
        // failover Canvas-2D (= 'animation pas visible' côté user).
        const c = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error('[Nyx][shader compile]',
                    type === gl.VERTEX_SHADER ? 'vertex' : 'fragment',
                    gl.getShaderInfoLog(s));
                return null;
            }
            return s;
        };
        const v = c(gl.VERTEX_SHADER, vsrc), f = c(gl.FRAGMENT_SHADER, fsrc);
        if (!v || !f) return null;
        const p = gl.createProgram();
        gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
            console.error('[Nyx][shader link]', gl.getProgramInfoLog(p));
            return null;
        }
        return p;
    }

    function pushUniforms(now, dt) {
        // Lerp position — mouvement organique, jamais sec.
        const lerp = Math.min(1, dt * 0.004);
        mx += (rawMx - mx) * lerp;
        my += (rawMy - my) * lerp;

        // Vélocité + direction lerpées → bow wave dans le shader.
        const dx = rawMx - prevRawMx, dy = rawMy - prevRawMy;
        const invSec = 1 / Math.max(0.001, dt * 0.001);
        const instantV = Math.min(2.0, Math.hypot(dx, dy) * invSec);
        mvel += (instantV - mvel) * Math.min(1, dt * 0.018);
        // Direction normalisée, lerpée pour rester smooth quand on ralentit.
        const spd = Math.hypot(dx, dy);
        if (spd > 0.0005) { const inv = 1 / spd; mvdx += (dx * inv - mvdx) * 0.25; mvdy += (dy * inv - mvdy) * 0.25; }
        else { mvdx *= 0.92; mvdy *= 0.92; }
        prevRawMx = rawMx; prevRawMy = rawMy;

        // Sillage : nouvel échantillon seulement si la souris a vraiment bougé.
        trailAccum += dt;
        const moved = Math.hypot(rawMx - lastTrailX, rawMy - lastTrailY) > 0.003;
        if (trailAccum >= 90 && moved) {
            trailHead = (trailHead - 1 + 4) & 3;
            TRAIL[trailHead].x = mx;
            TRAIL[trailHead].y = my;
            TRAIL[trailHead].age = 0;
            lastTrailX = rawMx; lastTrailY = rawMy;
            trailAccum = 0;
        }
        const ageInc = dt * 0.0009; // ~1.1s pour atteindre 1 (invisible)
        for (let i = 0; i < 4; i++) TRAIL[i].age += ageInc;

        // Vieillir tous les ripples (ils meurent à age >= 4.0 — voir shader rwave).
        const rippleAgeInc = dt * 0.001;
        for (let i = 0; i < 16; i++) RIPPLES[i].age += rippleAgeInc;

        // Shine du wordmark : distance souris → centre du mot, smoothstep falloff.
        // Respiration de base subtile, halo intense quand on s'approche.
        const csx = rawMx * innerWidth, csy = (1 - rawMy) * innerHeight;
        const wdist = Math.hypot(csx - wordCx, csy - wordCy);
        const tIn = wordReach * 0.20, tOut = wordReach * 1.00;
        let st = (wdist - tIn) / (tOut - tIn);
        st = st < 0 ? 0 : st > 1 ? 1 : st;
        const distShine = 1 - st * st * (3 - 2 * st);  // smoothstep inversé
        const breathe = 0.08 + 0.06 * Math.sin(now * 0.0009);
        const target = Math.max(breathe, distShine);
        shine += (target - shine) * Math.min(1, dt * 0.006);
        document.documentElement.style.setProperty('--nyx-shine', shine.toFixed(3));

        gl.uniform2f(GLU.res, canvas.width, canvas.height);
        gl.uniform1f(GLU.time, now * 0.001);
        gl.uniform2f(GLU.mouse, rawMx, rawMy);
        gl.uniform1f(GLU.mvel, mvel);
        gl.uniform2f(GLU.mdir, mvdx, mvdy);
        // Trail : du plus récent au plus ancien (lecture circulaire).
        const t0 = TRAIL[trailHead], t1 = TRAIL[(trailHead + 1) & 3];
        const t2 = TRAIL[(trailHead + 2) & 3], t3 = TRAIL[(trailHead + 3) & 3];
        gl.uniform3f(GLU.trail0, t0.x, t0.y, t0.age);
        gl.uniform3f(GLU.trail1, t1.x, t1.y, t1.age);
        gl.uniform3f(GLU.trail2, t2.x, t2.y, t2.age);
        gl.uniform3f(GLU.trail3, t3.x, t3.y, t3.age);
        // Ripples : 16 slots, poussés en un seul appel via Float32Array pré-alloué.
        for (let i = 0; i < 16; i++) { _rBuf[i*3] = RIPPLES[i].x; _rBuf[i*3+1] = RIPPLES[i].y; _rBuf[i*3+2] = RIPPLES[i].age; }
        gl.uniform3fv(GLU.ripples, _rBuf);
        gl.uniform3fv(GLU.p0, A.pal[0]); gl.uniform3fv(GLU.p1, A.pal[1]);
        gl.uniform3fv(GLU.p2, A.pal[2]); gl.uniform3fv(GLU.p3, A.pal[3]);
        gl.uniform3fv(GLU.glow, A.glow);
        gl.uniform1f(GLU.warp, A.warp); gl.uniform1f(GLU.vbias, A.vbias); gl.uniform1f(GLU.speed, A.speed);
    }

    function runGL() {
        // Governor de RÉSOLUTION : sous rendu logiciel (WSL), on rend en basse
        // résolution et le navigateur upscale → fluide même sans GPU.
        let quality = 0.85, fpsFrames = 0, fpsTimer = 0, last = 0;
        function sizeFor() {
            const w = Math.max(2, Math.round(innerWidth * quality));
            const h = Math.max(2, Math.round(innerHeight * quality));
            if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
        }
        function frame(now) {
            if (!last) last = now;
            const dt = now - last; last = now;
            fpsFrames++; fpsTimer += dt;
            if (fpsTimer >= 1000) {
                const fps = fpsFrames * 1000 / fpsTimer; fpsFrames = 0; fpsTimer = 0;
                quality = fps < 40 ? Math.max(0.4, quality - 0.12) : fps > 56 ? Math.min(1, quality + 0.08) : quality;
            }
            sizeFor();
            pushUniforms(now, dt || 16);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            if (!document.hidden) requestAnimationFrame(frame); else setTimeout(() => requestAnimationFrame(frame), 250);
        }
        document.addEventListener('visibilitychange', () => { if (!document.hidden) last = 0; });
        if (reduce) { sizeFor(); pushUniforms(12000, 16); gl.drawArrays(gl.TRIANGLES, 0, 3); }
        else requestAnimationFrame(frame);
    }

    // ══════════════════ Fallback Canvas-2D (léger, si pas de WebGL) ════════
    function runCanvas2D() {
        const ctx = canvas.getContext('2d');
        let W, H, parts = [];
        function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
        function seed() { parts = []; const n = Math.min(90, (innerWidth * innerHeight / 18000) | 0);
            for (let i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H,
                z: .4 + Math.random() * .6, r: 1 + Math.random() * 2, tw: Math.random() * 6.28 }); }
        addEventListener('resize', () => { resize(); seed(); });
        resize(); seed();
        let t = 0;
        function frame() {
            t += 0.005;
            const g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#070a12'); g.addColorStop(1, '#05070b');
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'lighter';
            const col = A.glow.map(c => (c * 255) | 0);
            for (const p of parts) {
                p.x += (0.1 + Math.sin(p.y * .004 + t) * .2) * p.z;
                p.y += Math.cos(p.x * .003 + t) * .05;
                if (p.x > W + 5) p.x = -5; if (p.x < -5) p.x = W + 5;
                if (p.y > H + 5) p.y = -5; if (p.y < -5) p.y = H + 5;
                const a = .25 + .35 * (0.5 + 0.5 * Math.sin(p.tw + t * 4));
                ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.z * 2, 0, 6.28); ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
            if (!document.hidden) requestAnimationFrame(frame); else setTimeout(() => requestAnimationFrame(frame), 250);
        }
        if (reduce) frame(); else requestAnimationFrame(frame);
    }
})();
</script>
