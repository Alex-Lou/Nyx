<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; form-action https://duckduckgo.com">
<title>Nyx</title>
{{TOKENS}}
<style>
:root {
    --text:   #e8ecff;
    --muted:  var(--nyx-dim);
    --aurora: var(--nyx-aurora);
    --glass:  rgba(10, 10, 26, 0.42);
    --glass-b:rgba(120, 130, 200, 0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #06060f; overflow: hidden; }
body {
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 38px;
}

.glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: background 1.4s ease; }
#fx { position: fixed; inset: 0; z-index: 1; }   /* interactif → reçoit la souris */

.vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse 78% 68% at 50% 48%, transparent 52%, rgba(6,6,15,.5) 100%);
}

main {
    position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 36px;
    animation: rise .8s cubic-bezier(.22,1,.36,1) both; pointer-events: none;
}
main * { pointer-events: auto; }
@keyframes rise { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wordmark {
    font-size: clamp(70px, 12vw, 132px); font-weight: 200; letter-spacing: .2em; line-height: 1;
    user-select: none; background: linear-gradient(135deg,#fff 0%,#c8d6ff 45%,#9d6ef7 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 44px rgba(157,110,247,.28)); animation: breathe 7s ease-in-out infinite;
    transition: letter-spacing .6s cubic-bezier(.22,1,.36,1), filter 1.2s ease;
}
.wordmark:hover { letter-spacing: .28em; }
@keyframes breathe {
    0%,100%{filter:drop-shadow(0 2px 44px rgba(157,110,247,.24))}
    50%{filter:drop-shadow(0 2px 66px rgba(157,110,247,.42))}
}
.tagline { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); opacity: .65; user-select: none; }

.search {
    display: flex; align-items: center; width: min(560px, 86vw);
    background: var(--glass); backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid var(--glass-b); border-radius: 18px; padding: 15px 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 40px rgba(0,0,0,.45);
    transition: border-color .3s, box-shadow .3s, transform .3s;
}
.search:focus-within {
    border-color: rgba(74,242,200,.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(74,242,200,.16), 0 16px 48px rgba(0,0,0,.55), 0 0 40px rgba(74,242,200,.08);
    transform: translateY(-3px);
}
.search svg { width: 17px; height: 17px; margin-right: 12px; opacity: .5; flex-shrink: 0; }
.search input {
    flex: 1; background: none; border: 0; outline: 0; color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14.5px; caret-color: var(--aurora);
}
.search input::placeholder { color: rgba(112,120,168,.55); }

.ambiance {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; gap: 18px; padding: 9px 18px; background: rgba(10,10,26,.4);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-b); border-radius: 28px;
}
.ambiance button {
    background: none; border: 0; cursor: pointer; font-family: inherit; font-size: 11px; letter-spacing: .06em;
    color: var(--muted); opacity: .6; display: flex; align-items: center; gap: 7px; transition: color .3s, opacity .3s;
}
.ambiance button::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; transition:transform .3s; }
.ambiance button:hover { opacity: .9; }
.ambiance button.active { opacity: 1; }
.ambiance button.active::before { transform: scale(1.6); }

.hint { position: fixed; top: 24px; right: 26px; z-index: 20; color: rgba(112,120,168,.5); font-size: 11px; user-select: none; }
.hint kbd { background: rgba(255,255,255,.04); border: 1px solid rgba(120,130,200,.16); border-radius: 5px; color: rgba(200,214,255,.7); font-family: 'JetBrains Mono',monospace; font-size: 10px; padding: 1px 6px; margin: 0 1px; }
</style>
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<p class="hint"><kbd>Ctrl</kbd><kbd>T</kbd> onglet · <kbd>Ctrl</kbd><kbd>L</kbd> adresse</p>

<main>
    <div class="brand">
        <h1 class="wordmark">Nyx</h1>
        <p class="tagline">une lumière plus douce</p>
    </div>
    <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input name="q" placeholder="Rechercher…" autofocus spellcheck="false">
    </form>
</main>

<nav class="ambiance" aria-label="Ambiance">
    <button data-mode="nebula" class="active">Nébuleuse</button>
    <button data-mode="aurora">Aurore</button>
    <button data-mode="sky">Ciel</button>
</nav>

<script>
(function () {
    'use strict';
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d', { alpha: true });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const glowEl = document.getElementById('glow');
    const wordmark = document.querySelector('.wordmark');

    let DPR = 1, W = 0, H = 0, t = 0, last = 0;
    const mouse = { x: -1e4, y: -1e4, active: false };

    // Qualité adaptative : départ selon les cœurs CPU, ajustée par le FPS réel.
    const CORES = navigator.hardwareConcurrency || 4;
    let quality = Math.max(0.45, Math.min(1, CORES / 8));
    let fpsFrames = 0, fpsTimer = 0;

    const rnd = (a, b) => a + Math.random() * (b - a);
    const TAU = Math.PI * 2;

    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = Math.floor(innerWidth * DPR);
        H = canvas.height = Math.floor(innerHeight * DPR);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        scene.resize();
    }

    // Sprite radial réutilisable (un par couleur) — additif.
    function softSprite(hex) {
        const s = document.createElement('canvas'); s.width = s.height = 64;
        const g = s.getContext('2d');
        const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
        const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grd.addColorStop(0, `rgba(${r},${gg},${b},1)`);
        grd.addColorStop(.25, `rgba(${r},${gg},${b},.5)`);
        grd.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
        return s;
    }

    /* ═══════════════════════════════════════════════════════════════════
       AMBIANCE 1 — NÉBULEUSE : nuages volumétriques qui respirent + braises
       portées par un champ tourbillonnant. Souris = vortex gravitationnel.
       Clic = floraison de lumière qui repousse les braises.
       ═══════════════════════════════════════════════════════════════════ */
    function Nebula() {
        const palette = ['#c8d6ff', '#9d6ef7', '#ff7eb3', '#6a5cff'];
        const sprites = palette.map(softSprite);
        let clouds = [], embers = [], blooms = [];

        function build() {
            clouds = [];
            for (let i = 0; i < 7; i++) clouds.push({
                x: rnd(0, W), y: rnd(0, H), r: rnd(0.18, 0.36) * W,
                hue: (Math.random() * palette.length) | 0,
                ph: rnd(0, TAU), sp: rnd(0.08, 0.22), drift: rnd(8, 26) * DPR,
            });
            const n = Math.round(150 * quality);
            embers = [];
            for (let i = 0; i < n; i++) embers.push({
                x: rnd(0, W), y: rnd(0, H), vx: 0, vy: 0,
                r: rnd(0.8, 2.4), z: rnd(.4, 1),
                hue: (Math.random() * palette.length) | 0, tw: rnd(0, TAU),
            });
        }
        return {
            palette,
            glow: 'radial-gradient(ellipse 75% 60% at 26% 20%, rgba(157,110,247,.16), transparent 60%),' +
                  'radial-gradient(ellipse 65% 55% at 82% 80%, rgba(255,126,179,.08), transparent 55%)',
            resize: build,
            enter() { build(); },
            click(x, y) { blooms.push({ x: x * DPR, y: y * DPR, age: 0, life: 50 }); if (blooms.length > 4) blooms.shift(); },
            frame(k) {
                // Nuages : positions oscillantes, rayon qui respire (additif).
                ctx.globalCompositeOperation = 'lighter';
                for (const c of clouds) {
                    const ox = Math.sin(t * c.sp + c.ph) * c.drift;
                    const oy = Math.cos(t * c.sp * 0.8 + c.ph) * c.drift;
                    const pr = c.r * (0.92 + 0.08 * Math.sin(t * 0.5 + c.ph));
                    ctx.globalAlpha = 0.10;
                    ctx.drawImage(sprites[c.hue], c.x + ox - pr, c.y + oy - pr, pr * 2, pr * 2);
                }
                // Braises : champ de flux curl + vortex souris + blooms.
                for (const e of embers) {
                    const a = Math.sin(e.x * 0.0016 + t * 0.6) + Math.cos(e.y * 0.0018 - t * 0.5);
                    const ang = a * Math.PI;
                    e.vx += Math.cos(ang) * 0.05 * DPR * k;
                    e.vy += Math.sin(ang) * 0.05 * DPR * k;
                    if (mouse.active) {
                        const dx = e.x - mouse.x, dy = e.y - mouse.y, d2 = dx * dx + dy * dy, R = 200 * DPR;
                        if (d2 < R * R && d2 > 1) {
                            const d = Math.sqrt(d2), f = (1 - d / R) * 0.9 * DPR * k;
                            e.vx += (-dy / d) * f - (dx / d) * f * 0.3;   // tangentiel → spirale
                            e.vy += ( dx / d) * f - (dy / d) * f * 0.3;
                        }
                    }
                    for (const bl of blooms) {
                        const dx = e.x - bl.x, dy = e.y - bl.y, d = Math.hypot(dx, dy) || 1, ring = bl.age * 9 * DPR;
                        if (Math.abs(d - ring) < 46 * DPR) { const f = (1 - bl.age / bl.life) * 1.4 * DPR * k; e.vx += dx / d * f; e.vy += dy / d * f; }
                    }
                    e.vx *= 0.94; e.vy *= 0.94; e.x += e.vx; e.y += e.vy;
                    if (e.x < -30) e.x = W + 30; else if (e.x > W + 30) e.x = -30;
                    if (e.y < -30) e.y = H + 30; else if (e.y > H + 30) e.y = -30;
                    const tw = 0.5 + 0.5 * Math.sin(e.tw + t * 3);
                    const r = e.r * e.z * DPR * 4.5 * (0.7 + tw * 0.5);
                    ctx.globalAlpha = 0.3 + 0.5 * tw;
                    ctx.drawImage(sprites[e.hue], e.x - r, e.y - r, r * 2, r * 2);
                }
                for (const bl of blooms) {
                    bl.age += k; const ring = bl.age * 9 * DPR, al = Math.max(0, 1 - bl.age / bl.life);
                    ctx.globalAlpha = al * 0.5;
                    ctx.drawImage(sprites[1], bl.x - ring, bl.y - ring, ring * 2, ring * 2);
                }
                blooms = blooms.filter(b => b.age < b.life);
                ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
            },
        };
    }

    /* ═══════════════════════════════════════════════════════════════════
       AMBIANCE 2 — AURORE : véritables rideaux de lumière verticaux, bords
       ondulants (sinus empilés), miroir au sol. Souris = écarte le rideau
       le plus proche. Clic = une impulsion remonte la colonne.
       ═══════════════════════════════════════════════════════════════════ */
    function Aurora() {
        const palette = ['#4af2c8', '#7b8cde', '#46d6a0', '#8a7bff'];
        let ribbons = [], pulses = [];

        function build() {
            ribbons = [];
            const count = 5;
            for (let i = 0; i < count; i++) {
                const hue = ['74,242,200', '123,140,222', '70,214,160', '138,123,255', '90,200,210'][i % 5];
                ribbons.push({
                    base: W * (i + 0.5) / count + rnd(-W * 0.04, W * 0.04),
                    w: rnd(70, 140) * DPR, hue,
                    sp: rnd(0.25, 0.5) * (Math.random() < .5 ? 1 : -1),
                    ph: rnd(0, TAU), amp: rnd(40, 90) * DPR, bend: 0,
                });
            }
        }
        function edge(rb, y) {
            return rb.base
                + Math.sin(y * 0.0042 + t * rb.sp + rb.ph) * rb.amp
                + Math.sin(y * 0.0017 - t * rb.sp * 0.6) * rb.amp * 0.45
                + rb.bend * Math.exp(-Math.pow((y - H * 0.45) / (H * 0.5), 2));
        }
        return {
            palette,
            glow: 'radial-gradient(ellipse 90% 75% at 50% 120%, rgba(74,242,200,.16), transparent 60%),' +
                  'radial-gradient(ellipse 55% 45% at 20% 8%, rgba(123,140,222,.08), transparent 55%)',
            resize: build,
            enter() { build(); },
            click(x, y) {
                let best = ribbons[0], bd = 1e9;
                for (const rb of ribbons) { const d = Math.abs(rb.base - x * DPR); if (d < bd) { bd = d; best = rb; } }
                pulses.push({ rb: best, y: H, life: 1 });
            },
            frame(k) {
                ctx.globalCompositeOperation = 'lighter';
                const STEP = 16 * DPR;
                for (const rb of ribbons) {
                    // Souris : le rideau proche s'incline vers le curseur.
                    let target = 0;
                    if (mouse.active) {
                        const d = mouse.x - rb.base;
                        if (Math.abs(d) < 260 * DPR) target = d * 0.45;
                    }
                    rb.bend += (target - rb.bend) * 0.06 * k;

                    const shimmer = 0.5 + 0.5 * Math.sin(t * 1.5 + rb.ph);
                    for (let y = -STEP; y < H + STEP; y += STEP) {
                        const cx = edge(rb, y);
                        const grad = ctx.createLinearGradient(cx - rb.w, 0, cx + rb.w, 0);
                        const a = (0.018 + 0.026 * shimmer) * (0.5 + 0.5 * Math.sin(y * 0.003 + t));
                        grad.addColorStop(0, `rgba(${rb.hue},0)`);
                        grad.addColorStop(0.5, `rgba(${rb.hue},${a})`);
                        grad.addColorStop(1, `rgba(${rb.hue},0)`);
                        ctx.fillStyle = grad;
                        ctx.fillRect(cx - rb.w, y, rb.w * 2, STEP + 1);
                    }
                    // Crête lumineuse + reflet bas.
                    ctx.strokeStyle = `rgba(${rb.hue},${0.10 + 0.10 * shimmer})`;
                    ctx.lineWidth = 2 * DPR; ctx.beginPath();
                    for (let y = 0; y <= H; y += STEP) { const cx = edge(rb, y); y === 0 ? ctx.moveTo(cx, y) : ctx.lineTo(cx, y); }
                    ctx.stroke();
                }
                // Impulsions verticales (clic).
                for (const p of pulses) {
                    p.y -= 9 * DPR * k; p.life -= 0.012 * k;
                    const cx = edge(p.rb, p.y);
                    const grd = ctx.createRadialGradient(cx, p.y, 0, cx, p.y, 80 * DPR);
                    grd.addColorStop(0, `rgba(${p.rb.hue},${0.5 * p.life})`);
                    grd.addColorStop(1, `rgba(${p.rb.hue},0)`);
                    ctx.fillStyle = grd; ctx.fillRect(cx - 80 * DPR, p.y - 80 * DPR, 160 * DPR, 160 * DPR);
                }
                pulses = pulses.filter(p => p.life > 0 && p.y > -100);
                ctx.globalCompositeOperation = 'source-over';
            },
        };
    }

    /* ═══════════════════════════════════════════════════════════════════
       AMBIANCE 3 — CIEL : nuit étoilée réaliste — voie lactée, scintillement
       net, constellations reliées, croissant de lune, étoiles filantes.
       Souris = parallaxe selon la profondeur. Clic = onde + constellation
       qui s'illumine sur les étoiles vives proches.
       ═══════════════════════════════════════════════════════════════════ */
    function Sky() {
        const palette = ['#ffffff', '#c8d6ff', '#9fb0e8'];
        const sprites = palette.map(softSprite);
        let stars = [], links = [], shoot = null, shootIn = 160, flashes = [], ripples = [];

        function build() {
            const n = Math.round(220 * quality);
            stars = [];
            for (let i = 0; i < n; i++) {
                const big = Math.random() < 0.10;
                stars.push({
                    x: rnd(0, W), y: rnd(0, H), z: rnd(0.15, 1),
                    r: big ? rnd(1.6, 2.6) : rnd(0.5, 1.4), big,
                    hue: (Math.random() * palette.length) | 0,
                    tw: rnd(0, TAU), tws: rnd(1.2, 3),
                });
            }
            // Constellations : relie quelques étoiles vives proches.
            links = [];
            const bigs = stars.filter(s => s.big);
            for (const a of bigs) {
                let near = null, nd = 1e9;
                for (const b of bigs) {
                    if (b === a) continue;
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < nd && d < 260 * DPR) { nd = d; near = b; }
                }
                if (near) links.push([a, near, rnd(0, TAU)]);
            }
        }
        function px(s) { return s.x + (mouse.active ? (mouse.x - W / 2) * s.z * 0.04 : 0); }
        function py(s) { return s.y + (mouse.active ? (mouse.y - H / 2) * s.z * 0.04 : 0); }
        return {
            palette,
            glow: 'radial-gradient(ellipse 70% 55% at 50% 4%, rgba(123,140,222,.12), transparent 60%),' +
                  'radial-gradient(ellipse 60% 50% at 82% 82%, rgba(200,214,255,.05), transparent 55%)',
            resize: build,
            enter() { build(); },
            click(x, y) {
                ripples.push({ x: x * DPR, y: y * DPR, age: 0, life: 55 });
                let lit = 0;
                for (const s of stars) {
                    if (s.big && Math.hypot(s.x - x * DPR, s.y - y * DPR) < 220 * DPR) { flashes.push({ s, life: 1 }); if (++lit > 6) break; }
                }
            },
            frame(k) {
                // Voie lactée : bande diagonale douce.
                ctx.save();
                ctx.translate(W * 0.5, H * 0.5); ctx.rotate(-0.5); ctx.translate(-W * 0.5, -H * 0.5);
                const mw = ctx.createLinearGradient(0, H * 0.36, 0, H * 0.64);
                mw.addColorStop(0, 'rgba(123,140,222,0)');
                mw.addColorStop(0.5, 'rgba(150,160,230,0.05)');
                mw.addColorStop(1, 'rgba(123,140,222,0)');
                ctx.fillStyle = mw; ctx.fillRect(-W, H * 0.36, W * 3, H * 0.28);
                ctx.restore();

                // Croissant de lune (haut-droite).
                const mx = W * 0.84, my = H * 0.16, mr = 46 * DPR;
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU);
                const mg = ctx.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .2, mx, my, mr);
                mg.addColorStop(0, 'rgba(232,238,255,.95)'); mg.addColorStop(1, 'rgba(123,140,222,.5)');
                ctx.fillStyle = mg; ctx.fill();
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); ctx.arc(mx + mr * .42, my - mr * .12, mr * .92, 0, TAU); ctx.fill();
                ctx.globalCompositeOperation = 'lighter';

                // Constellations (lignes douces, pulsation lente).
                ctx.lineWidth = DPR * 0.7;
                for (const [a, b, ph] of links) {
                    const al = 0.10 + 0.10 * Math.sin(t * 0.6 + ph);
                    ctx.strokeStyle = `rgba(160,180,240,${al})`;
                    ctx.beginPath(); ctx.moveTo(px(a), py(a)); ctx.lineTo(px(b), py(b)); ctx.stroke();
                }
                // Étoiles : scintillement net + parallaxe.
                for (const s of stars) {
                    const tw = 0.5 + 0.5 * Math.sin(s.tw + t * s.tws);
                    const r = s.r * DPR * (s.big ? 4 : 2.6) * (0.6 + tw * 0.6);
                    ctx.globalAlpha = (s.big ? 0.5 : 0.32) + 0.5 * tw;
                    ctx.drawImage(sprites[s.hue], px(s) - r, py(s) - r, r * 2, r * 2);
                }
                // Flashs au clic.
                for (const f of flashes) {
                    f.life -= 0.03 * k; const r = 8 * DPR * (1 + (1 - f.life) * 2);
                    ctx.globalAlpha = Math.max(0, f.life);
                    ctx.drawImage(sprites[0], px(f.s) - r, py(f.s) - r, r * 2, r * 2);
                }
                flashes = flashes.filter(f => f.life > 0);
                // Ondes au clic.
                ctx.globalAlpha = 1;
                for (const rp of ripples) {
                    rp.age += k; const ring = rp.age * 8 * DPR, al = Math.max(0, 1 - rp.age / rp.life);
                    ctx.strokeStyle = `rgba(200,214,255,${al * 0.4})`; ctx.lineWidth = 1.5 * DPR;
                    ctx.beginPath(); ctx.arc(rp.x, rp.y, ring, 0, TAU); ctx.stroke();
                }
                ripples = ripples.filter(r => r.age < r.life);

                // Étoile filante occasionnelle.
                if (!shoot) { if ((shootIn -= k) <= 0) { shootIn = rnd(160, 420); shoot = { x: rnd(W * .1, W * .7), y: rnd(0, H * .35), vx: rnd(7, 11) * DPR, vy: rnd(3, 5) * DPR, life: 1 }; } }
                else {
                    shoot.x += shoot.vx * k; shoot.y += shoot.vy * k; shoot.life -= 0.012 * k;
                    if (shoot.life <= 0 || shoot.x > W || shoot.y > H) shoot = null;
                    else {
                        const tx = shoot.x - shoot.vx * 9, ty = shoot.y - shoot.vy * 9;
                        const g = ctx.createLinearGradient(shoot.x, shoot.y, tx, ty);
                        g.addColorStop(0, `rgba(220,230,255,${0.9 * shoot.life})`); g.addColorStop(1, 'rgba(220,230,255,0)');
                        ctx.strokeStyle = g; ctx.lineWidth = 2 * DPR; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(tx, ty); ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
            },
        };
    }

    // ── Orchestration ───────────────────────────────────────────────────────
    const SCENES = { nebula: Nebula(), aurora: Aurora(), sky: Sky() };
    const WORDMARK_GRAD = {
        nebula: 'linear-gradient(135deg,#fff 0%,#c8d6ff 45%,#9d6ef7 100%)',
        aurora: 'linear-gradient(135deg,#fff 0%,#bafce6 45%,#4af2c8 100%)',
        sky:    'linear-gradient(135deg,#fff 0%,#dfe6ff 45%,#7b8cde 100%)',
    };
    let scene = SCENES.nebula, mode = 'nebula';

    function setMode(name) {
        if (!SCENES[name]) return;
        mode = name; scene = SCENES[name]; scene.enter();
        glowEl.style.background = scene.glow;
        wordmark.style.background = WORDMARK_GRAD[name];
        wordmark.style.webkitBackgroundClip = 'text';
        wordmark.style.backgroundClip = 'text';
        document.querySelectorAll('.ambiance button').forEach(b => b.classList.toggle('active', b.dataset.mode === name));
    }

    function frame(now) {
        if (!last) { last = now; requestAnimationFrame(frame); return; }
        const dt = now - last; last = now;
        const k = Math.min(2, Math.max(0.4, dt / 16.67)) || 1;
        t += 0.006 * k;

        fpsFrames++; fpsTimer += dt;
        if (fpsTimer >= 1000) {
            const fps = fpsFrames * 1000 / fpsTimer; fpsFrames = 0; fpsTimer = 0;
            const nq = fps < 45 ? Math.max(0.3, quality - 0.15) : fps > 57 ? Math.min(1, quality + 0.1) : quality;
            if (Math.abs(nq - quality) > 0.001) { quality = nq; scene.resize(); }
        }

        ctx.clearRect(0, 0, W, H);
        scene.frame(k);
        requestAnimationFrame(frame);
    }

    // ── Entrées ─────────────────────────────────────────────────────────────
    addEventListener('resize', resize);
    canvas.addEventListener('pointermove', e => { mouse.x = e.clientX * DPR; mouse.y = e.clientY * DPR; mouse.active = true; });
    canvas.addEventListener('pointerleave', () => { mouse.active = false; mouse.x = mouse.y = -1e4; });
    canvas.addEventListener('pointerdown', e => { if (scene.click) scene.click(e.clientX, e.clientY); });
    document.querySelectorAll('.ambiance button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) last = performance.now(); });

    // ── Démarrage ───────────────────────────────────────────────────────────
    resize(); setMode('nebula');
    if (reduce) { scene.frame(1); } else { requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
