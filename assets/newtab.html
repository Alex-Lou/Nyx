<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; media-src file:; form-action https://duckduckgo.com">
<title>Nyx</title>
<style>
:root {
    --surface: #0f0f22;
    --border:  #1e1e40;
    --star:    #c8d6ff;
    --aurora:  #4af2c8;
    --text:    #dde4ff;
    --dim:     #7078a8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; background: #06060f; overflow: hidden; }

body {
    height: 100%;
    color: var(--text);
    font-family: 'Geist Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    overflow: hidden;
}

/* ── Fond vidéo ──────────────────────────────────── */

.bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
}

/* Vagues bleues cosmiques — visible en premier */
.bg-waves {
    z-index: 0;
    opacity: 0.88;
    animation: bg-crossfade 20s ease-in-out infinite;
}

/* Ciel nocturne violet — crossfade en décalé */
.bg-nebula {
    z-index: 1;
    opacity: 0;
    animation: bg-crossfade 20s ease-in-out infinite -10s;
}

@keyframes bg-crossfade {
    0%,   38% { opacity: 0.88; }
    48%,  88% { opacity: 0;    }
    98%,  100%{ opacity: 0.88; }
}

/* Voile sombre pour lisibilité du texte */
.bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 50% 50%,
        rgba(6,6,15,0.55) 0%, rgba(6,6,15,0.30) 60%, rgba(6,6,15,0.10) 100%);
}

/* ── Starfield CSS (couche supplémentaire de profondeur) ── */

.stars {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background-image:
        radial-gradient(1px 1px at  8%  11%, rgba(200,214,255,.40) 0%, transparent 100%),
        radial-gradient(1px 1px at 23%   6%, rgba(200,214,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 41%  20%, rgba(200,214,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 62%   4%, rgba(200,214,255,.30) 0%, transparent 100%),
        radial-gradient(1px 1px at 80%  15%, rgba(200,214,255,.45) 0%, transparent 100%),
        radial-gradient(1px 1px at  5%  59%, rgba(200,214,255,.30) 0%, transparent 100%),
        radial-gradient(1px 1px at 35%  73%, rgba(200,214,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 72%  64%, rgba(200,214,255,.28) 0%, transparent 100%),
        radial-gradient(1px 1px at 88%  79%, rgba(200,214,255,.40) 0%, transparent 100%),
        radial-gradient(1px 1px at 38%  43%, rgba(74,242,200,.30)  0%, transparent 100%),
        radial-gradient(1px 1px at 67%  56%, rgba(74,242,200,.25)  0%, transparent 100%),
        radial-gradient(2px 2px at 51%  28%, rgba(157,110,247,.25) 0%, transparent 100%);
    animation: starfield 14s ease-in-out infinite alternate;
}

@keyframes starfield {
    from { opacity: .50; }
    to   { opacity: .90; }
}

/* ── Contenu ─────────────────────────────────────── */

main {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    animation: fadein .55s cubic-bezier(0.4, 0, 0.2, 1) both;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── Wordmark ─────────────────────────────────────── */

.wordmark {
    font-size: clamp(72px, 13vw, 140px);
    font-weight: 200;
    letter-spacing: 0.14em;
    color: var(--aurora);
    line-height: 1;
    user-select: none;
    animation: breathe 5s ease-in-out infinite;
    transition: letter-spacing 350ms cubic-bezier(0.4, 0, 0.2, 1);
}

.wordmark:hover { letter-spacing: 0.22em; }

@keyframes breathe {
    0%, 100% {
        text-shadow: 0 0 40px rgba(74,242,200,.30), 0 0 80px rgba(74,242,200,.10);
    }
    50% {
        text-shadow: 0 0 55px rgba(74,242,200,.55), 0 0 110px rgba(74,242,200,.22), 0 0 200px rgba(74,242,200,.07);
    }
}

/* ── Barre de recherche ───────────────────────────── */

.search {
    display: flex;
    align-items: center;
    width: min(580px, 88vw);
    background: rgba(15,15,34,0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 18px;
    transition:
        border-color 180ms cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow   180ms cubic-bezier(0.4, 0, 0.2, 1),
        transform    180ms cubic-bezier(0.4, 0, 0.2, 1);
}

.search:focus-within {
    border-color: var(--aurora);
    box-shadow:
        0 0 0 1px rgba(74,242,200,.22),
        0 0 32px rgba(74,242,200,.10),
        0 4px 28px rgba(6,6,15,.7);
    transform: translateY(-2px);
}

.search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    font-size: 15px;
    caret-color: var(--aurora);
}

.search input::placeholder { color: var(--dim); }

/* ── Raccourcis ───────────────────────────────────── */

.hint {
    color: rgba(112, 120, 168, 0.70);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-align: center;
    user-select: none;
}

.hint kbd {
    background: rgba(15,15,34,0.80);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--star);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    margin: 0 1px;
    padding: 1px 6px;
}
</style>
</head>
<body>
    <video class="bg-video bg-waves" autoplay muted loop playsinline>
        <source src="bg-waves.mp4" type="video/mp4">
    </video>
    <video class="bg-video bg-nebula" autoplay muted loop playsinline>
        <source src="bg-nebula.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay" aria-hidden="true"></div>
    <div class="stars"      aria-hidden="true"></div>
    <main>
        <h1 class="wordmark">Nyx</h1>
        <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
            <input name="q" placeholder="Rechercher avec DuckDuckGo…" autofocus spellcheck="false">
        </form>
        <p class="hint">
            <kbd>Ctrl</kbd><kbd>T</kbd> onglet
            &nbsp;·&nbsp;
            <kbd>Ctrl</kbd><kbd>L</kbd> adresse
            &nbsp;·&nbsp;
            <kbd>Ctrl</kbd><kbd>W</kbd> fermer
            &nbsp;·&nbsp;
            <kbd>Ctrl</kbd><kbd>Tab</kbd> suivant
        </p>
    </main>
</body>
</html>
