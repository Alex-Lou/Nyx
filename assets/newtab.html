<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; media-src file:; form-action https://duckduckgo.com">
<title>Nyx</title>
<style>
:root {
    --glass-bg:   rgba(8, 8, 22, 0.55);
    --glass-border: rgba(120, 130, 200, 0.14);
    --text:   #e8ecff;
    --muted:  #7078a8;
    --accent: #4af2c8;
    --dim-border: rgba(74, 242, 200, 0.22);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; background: #080816; overflow: hidden; }

body {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    color: var(--text);
    font-family: 'Geist Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

/* ── Sélecteur de fond (CSS-only radio hack) ─────── */

.bg-radio { display: none; }

.bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: none;
    /* Fade en début/fin pour masquer la couture de boucle (~8s) */
    animation: loop-fade 8.04s linear infinite;
}

@keyframes loop-fade {
    0%, 100%  { opacity: 0;    }
    4%        { opacity: 0.82; }
    90%       { opacity: 0.82; }
}

#bg1:checked ~ #v1 { display: block; }
#bg2:checked ~ #v2 { display: block; }
#bg3:checked ~ #v3 { display: block; }
#bg4:checked ~ #v4 { display: block; }

/* ── Voile de profondeur ─────────────────────────── */

.bg-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
        radial-gradient(ellipse 70% 55% at 50% 50%,
            rgba(5,5,18,0.60) 0%, rgba(5,5,18,0.20) 65%, transparent 100%),
        linear-gradient(180deg, rgba(5,5,18,0.35) 0%, transparent 40%, rgba(5,5,18,0.50) 100%);
}

/* ── Contenu ─────────────────────────────────────── */

main {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    animation: fadein 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes fadein {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── Wordmark ─────────────────────────────────────── */

.wordmark {
    font-size: clamp(68px, 12vw, 128px);
    font-weight: 200;
    letter-spacing: 0.18em;
    color: rgba(232, 236, 255, 0.92);
    line-height: 1;
    user-select: none;
    transition: letter-spacing 500ms cubic-bezier(0.22, 1, 0.36, 1),
                color 500ms ease;
    text-shadow:
        0 2px 40px rgba(74, 242, 200, 0.12),
        0 1px 0 rgba(255,255,255,0.06);
    animation: wordmark-breathe 7s ease-in-out infinite;
}

.wordmark:hover {
    letter-spacing: 0.28em;
    color: #ffffff;
}

@keyframes wordmark-breathe {
    0%, 100% { text-shadow: 0 2px 40px rgba(74,242,200,.12), 0 1px 0 rgba(255,255,255,.06); }
    50%       { text-shadow: 0 2px 60px rgba(74,242,200,.28), 0 0 90px rgba(74,242,200,.08), 0 1px 0 rgba(255,255,255,.10); }
}

/* ── Barre de recherche ───────────────────────────── */

.search {
    display: flex;
    align-items: center;
    width: min(560px, 86vw);
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 20px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 8px 32px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.30);
    transition:
        border-color 250ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow   250ms cubic-bezier(0.22, 1, 0.36, 1),
        transform    250ms cubic-bezier(0.22, 1, 0.36, 1);
}

.search:focus-within {
    border-color: var(--dim-border);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 0 1px rgba(74,242,200,.18),
        0 12px 40px rgba(0,0,0,0.55),
        0 0 30px rgba(74,242,200,.07);
    transform: translateY(-3px);
}

.search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    font-size: 14px;
    letter-spacing: 0.01em;
    caret-color: var(--accent);
}

.search input::placeholder {
    color: rgba(112, 120, 168, 0.55);
    letter-spacing: 0.03em;
}

/* ── Sélecteur de fond — dots ─────────────────────── */

.picker {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 14px;
    background: rgba(8, 8, 22, 0.50);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
}

.picker label {
    display: block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(112, 120, 168, 0.40);
    cursor: pointer;
    transition: background 250ms ease, transform 250ms cubic-bezier(0.22, 1, 0.36, 1);
}

.picker label:hover { background: rgba(112, 120, 168, 0.75); transform: scale(1.3); }

/* Dot actif selon la radio cochée */
#bg1:checked ~ .picker label[for="bg1"],
#bg2:checked ~ .picker label[for="bg2"],
#bg3:checked ~ .picker label[for="bg3"],
#bg4:checked ~ .picker label[for="bg4"] {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(74,242,200,.55);
    transform: scale(1.5);
}

/* ── Raccourcis ───────────────────────────────────── */

.hint {
    color: rgba(112, 120, 168, 0.60);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-align: center;
    user-select: none;
}

.hint kbd {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(120,130,200,0.18);
    border-radius: 5px;
    color: rgba(200, 214, 255, 0.70);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    margin: 0 1px;
    padding: 1px 6px;
}
</style>
</head>
<body>

<!-- Sélecteur CSS-only (doit précéder les vidéos et le picker) -->
<input type="radio" name="bg" id="bg1" class="bg-radio" checked>
<input type="radio" name="bg" id="bg2" class="bg-radio">
<input type="radio" name="bg" id="bg3" class="bg-radio">
<input type="radio" name="bg" id="bg4" class="bg-radio">

<!-- Fonds vidéo (une seule jouée à la fois via CSS) -->
<video id="v1" class="bg-video" autoplay muted loop playsinline>
    <source src="bg-waves.mp4" type="video/mp4">
</video>
<video id="v2" class="bg-video" autoplay muted loop playsinline>
    <source src="bg-nebula.mp4" type="video/mp4">
</video>
<video id="v3" class="bg-video" autoplay muted loop playsinline>
    <source src="bg-silk.mp4" type="video/mp4">
</video>
<video id="v4" class="bg-video" autoplay muted loop playsinline>
    <source src="bg-teal.mp4" type="video/mp4">
</video>

<div class="bg-overlay" aria-hidden="true"></div>

<!-- Picker dots (frère des radios pour le sélecteur CSS) -->
<div class="picker" role="group" aria-label="Fond d'écran">
    <label for="bg1" title="Vagues cosmiques"></label>
    <label for="bg2" title="Nuit étoilée"></label>
    <label for="bg3" title="Soie"></label>
    <label for="bg4" title="Émeraude"></label>
</div>

<main>
    <h1 class="wordmark">Nyx</h1>
    <form class="search" action="https://duckduckgo.com/" method="get" autocomplete="off">
        <input name="q" placeholder="Rechercher…" autofocus spellcheck="false">
    </form>
    <p class="hint">
        <kbd>Ctrl</kbd><kbd>T</kbd> onglet &nbsp;·&nbsp;
        <kbd>Ctrl</kbd><kbd>L</kbd> adresse &nbsp;·&nbsp;
        <kbd>Ctrl</kbd><kbd>W</kbd> fermer
    </p>
</main>

</body>
</html>
