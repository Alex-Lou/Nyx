<!DOCTYPE html>
<!-- Page de démarrage Nyx — auto-contenue, aucune requête réseau.
     Servie par le scheme custom nyx://start (voir startpage.rs). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nyx</title>
<style>
    :root {
        --void:     #06060f;
        --deep:     #0a0a18;
        --surface:  #0f0f22;
        --raised:   #141430;
        --border:   #1e1e40;
        --star:     #c8d6ff;
        --moon:     #7b8cde;
        --nebula:   #9d6ef7;
        --aurora:   #4af2c8;
        --text:     #dde4ff;
        --dim:      #7078a8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse 120% 90% at 50% 110%,
                    #141438 0%, var(--deep) 45%, var(--void) 100%);
        font-family: system-ui, sans-serif;
        color: var(--text);
    }

    /* ── Ciel étoilé (rempli par le script) ───────── */
    #sky { position: fixed; inset: 0; }

    .s {
        position: absolute;
        border-radius: 50%;
        background: var(--star);
        animation: twinkle var(--d) ease-in-out infinite;
        animation-delay: var(--o);
    }

    @keyframes twinkle {
        0%, 100% { opacity: var(--lo); }
        50%      { opacity: 1; transform: scale(1.3); }
    }

    /* Étoile filante, passe de temps en temps */
    #meteor {
        position: absolute;
        width: 130px; height: 1px;
        background: linear-gradient(90deg, transparent, var(--star));
        opacity: 0;
        transform: rotate(-30deg);
        animation: meteor 9s linear infinite;
        animation-delay: 4s;
    }

    @keyframes meteor {
        0%   { opacity: 0; top: 12%; left: 75%; }
        1%   { opacity: .9; }
        5%   { opacity: 0; top: 32%; left: 55%; }
        100% { opacity: 0; }
    }

    /* ── Lune ──────────────────────────────────────── */
    #moon {
        position: fixed;
        top: 10%; right: 14%;
        width: 90px; height: 90px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 32%, #e8eeff, var(--moon) 65%, #56629e);
        box-shadow: 0 0 60px rgba(123, 140, 222, .45),
                    0 0 140px rgba(123, 140, 222, .18);
        animation: drift 14s ease-in-out infinite;
    }

    @keyframes drift {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-14px); }
    }

    /* ── Centre ────────────────────────────────────── */
    main {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        animation: rise 800ms cubic-bezier(.2, .8, .25, 1) both;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: 64px;
        font-weight: 200;
        letter-spacing: .42em;
        margin-left: .42em; /* compense le tracking du dernier glyphe */
        background: linear-gradient(115deg, var(--star), var(--nebula) 55%, var(--aurora));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 48px rgba(157, 110, 247, .35);
    }

    #clock {
        font-size: 15px;
        letter-spacing: .35em;
        margin-left: .35em;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
    }

    form { width: min(560px, 82vw); }

    #q {
        width: 100%;
        padding: 15px 26px;
        font-size: 15px;
        color: var(--text);
        background: rgba(20, 20, 48, .65);
        border: 1px solid var(--border);
        border-radius: 999px;
        outline: none;
        caret-color: var(--aurora);
        backdrop-filter: blur(6px);
        transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    #q::placeholder { color: var(--dim); }

    #q:focus {
        border-color: var(--aurora);
        box-shadow: 0 0 0 3px rgba(74, 242, 200, .15),
                    0 0 32px rgba(74, 242, 200, .12);
    }

    footer {
        position: fixed;
        bottom: 22px;
        width: 100%;
        text-align: center;
        font-size: 11px;
        letter-spacing: .2em;
        color: var(--dim);
        opacity: .6;
    }
</style>
</head>
<body>
    <div id="sky"></div>
    <div id="meteor"></div>
    <div id="moon"></div>

    <main>
        <h1>NYX</h1>
        <div id="clock">--:--</div>
        <form action="https://duckduckgo.com/" method="get">
            <input id="q" name="q" type="search" autofocus autocomplete="off"
                   placeholder="Chercher dans la nuit…">
        </form>
    </main>

    <footer>LA NUIT N'EST PAS L'ABSENCE DE LUMIÈRE</footer>

<script>
    // Étoiles : positions aléatoires, scintillement décalé
    (function () {
        var sky = document.getElementById('sky');
        for (var i = 0; i < 110; i++) {
            var s = document.createElement('div');
            s.className = 's';
            var size = Math.random() < 0.85 ? 1.5 : 2.5;
            s.style.width = s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top  = Math.random() * 100 + '%';
            s.style.setProperty('--d',  (2.5 + Math.random() * 4) + 's');
            s.style.setProperty('--o',  (-Math.random() * 6) + 's');
            s.style.setProperty('--lo', (0.15 + Math.random() * 0.4));
            sky.appendChild(s);
        }
    })();

    // Horloge
    (function () {
        var el = document.getElementById('clock');
        function tick() {
            var d = new Date();
            el.textContent = String(d.getHours()).padStart(2, '0') + ':' +
                             String(d.getMinutes()).padStart(2, '0');
        }
        tick();
        setInterval(tick, 10000);
    })();
</script>
</body>
</html>
