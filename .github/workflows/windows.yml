name: Windows

on:
  push:
    branches: [develop]
    paths:
      - "crates/nyx-win/**"
      - "crates/nyx-core/**"
      - "crates/vault/**"
      - "assets/**"
      - "Cargo.toml"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    name: Nyx.exe (WebView2)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Coffre : SQLCipher compilé + OpenSSL vendu (openssl-src). Le Perl de
      # Git Bash (msys) casse le Configure d'OpenSSL pour MSVC : on impose
      # Strawberry Perl (préinstallé sur windows-latest). Pas de NASM :
      # OpenSSL en `no-asm` (build déterministe ; AES en C portable, plus
      # lent que l'assembleur mais très suffisant pour une base locale).
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
      OPENSSL_RUST_USE_NASM: "0"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Rust stable (MSVC)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build release
        run: cargo build --release -p nyx-win

      - name: Nyx.exe
        run: |
          mkdir -p dist
          cp target/release/nyx-win.exe dist/Nyx.exe
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-windows
          path: dist/Nyx.exe
          if-no-files-found: error
          retention-days: 30

      # Qualité APRÈS l'artefact : un nouveau lint ne bloque jamais Nyx.exe,
      # mais fait quand même échouer le job.
      - name: Tests (logique pure + coffre)
        run: cargo test -p nyx-win -p vault

      - name: Clippy
        run: cargo clippy -p nyx-win --all-targets -- -D warnings
