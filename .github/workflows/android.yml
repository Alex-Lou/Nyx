name: Android

on:
  push:
    branches: [develop]
    paths:
      - "android/**"
      - "VERSION"
      - "crates/nyx-core/**"
      - "crates/nyx-ffi/**"
      - "crates/vault/**"
      - "assets/newtab.html"
      - "assets/password_capture.js"
      - "assets/filterlists/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_NDK_VERSION: "3.5.4"

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cibles Rust Android
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "$CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --force
          fi

      - name: libnyx_ffi.so (arm64-v8a + x86_64)
        run: |
          # NDK préinstallé sur les runners ubuntu-latest.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK : $ANDROID_NDK_HOME"
          # Coffre : SQLCipher + OpenSSL vendu (openssl-src, Configure en Perl,
          # présent sur ubuntu-latest). cargo-ndk exporte CC_/AR_<cible> ; on
          # ajoute la chaîne LLVM du NDK au PATH pour que `cc` trouve aussi
          # llvm-ranlib (les binutils GNU n'existent plus depuis NDK r23).
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          command -v llvm-ranlib && command -v perl
          cargo ndk \
            --target arm64-v8a --target x86_64 \
            --platform 26 \
            --output-dir android/app/src/main/jniLibs \
            build --release -p nyx-ffi
          find android/app/src/main/jniLibs -name '*.so' -exec ls -l {} \;

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Clé permanente présente → APK release signé (mises à jour par-dessus).
      # Sinon → APK debug (clé jetable : désinstaller avant chaque mise à jour).
      - name: APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NYX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nyx.p12"
            export NYX_KEYSTORE="$RUNNER_TEMP/nyx.p12"
            # Alias de la clé privée (celui choisi par Windows à l'export).
            export NYX_KEY_ALIAS="$(keytool -list -keystore "$NYX_KEYSTORE" -storetype pkcs12 \
              -storepass "$NYX_KEYSTORE_PASSWORD" | grep -i PrivateKeyEntry | head -n1 | cut -d, -f1)"
            [ -n "$NYX_KEY_ALIAS" ] || { echo "Clé introuvable dans le keystore"; exit 1; }
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Nyx.apk"
            rm -f "$RUNNER_TEMP/nyx.p12"
          else
            ./gradlew --no-daemon assembleDebug
            cp "$(ls app/build/outputs/apk/debug/*.apk | head -n1)" "$RUNNER_TEMP/Nyx.apk"
          fi

      - name: Vérifier la présence de la lib native dans l'APK
        run: unzip -l "$RUNNER_TEMP/Nyx.apk" | grep -E 'lib/(arm64-v8a|x86_64)/libnyx_ffi.so'

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-android
          path: ${{ runner.temp }}/Nyx.apk
          if-no-files-found: error
          retention-days: 30
